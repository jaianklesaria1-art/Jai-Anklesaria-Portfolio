<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}

/* ─── Loading ─────────────────────────────────── */
#loading{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease}
#ld-name{font-size:clamp(18px,2.5vw,28px);font-weight:600;color:#fff;letter-spacing:-.02em}
#ld-bar{width:180px;height:1px;background:rgba(255,255,255,0.1)}
#ld-fill{height:1px;background:#fff;width:0%;transition:width .04s}
#ld-pct{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:.1em}

/* ─── WebGL canvas ───────────────────────────── */
#webgl{position:fixed;inset:0;z-index:1}
#webgl canvas{width:100%!important;height:100%!important}

/* ─── UI overlay ─────────────────────────────── */
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}

/* ─── Nav top-left ───────────────────────────── */
#nav{position:absolute;top:20px;left:24px;display:flex;align-items:center;gap:10px;pointer-events:all}
#nav-logo{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s}
#nav-logo:hover{background:rgba(255,255,255,0.15)}
#nav-links{height:40px;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,0.07);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:9999px;padding:0 18px}
#nav-links a{color:rgba(255,255,255,0.75);font-size:13px;font-weight:500;text-decoration:none;transition:color .15s;pointer-events:all;cursor:pointer}
#nav-links a:hover{color:#fff}

/* ─── Nav top-right ──────────────────────────── */
#nav-right{position:absolute;top:20px;right:24px;pointer-events:all}
#hire-btn{height:40px;padding:0 18px;border-radius:9999px;background:rgba(255,255,255,0.07);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:background .2s;cursor:pointer;pointer-events:all}
#hire-btn:hover{background:rgba(255,255,255,0.14)}

/* ─── Center HUD ─────────────────────────────── */
#hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-175px);text-align:center;pointer-events:none;transition:opacity .4s}
#hud-num{font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:.22em;text-transform:uppercase;margin-bottom:5px}
#hud-label{font-size:13px;font-weight:500;color:rgba(255,255,255,0.75);letter-spacing:-.01em}

/* ─── Click prompt ───────────────────────────── */
#click-prompt{position:absolute;top:50%;left:50%;transform:translate(-50%,130px);font-size:10px;color:rgba(255,255,255,0.28);letter-spacing:.18em;text-transform:uppercase;pointer-events:none}

/* ─── Identity bottom-left ───────────────────── */
#identity{position:absolute;bottom:36px;left:28px}
#id-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:-.02em}
#id-role{font-size:11px;color:rgba(255,255,255,0.38);margin-top:3px;letter-spacing:.02em}

/* ─── Project nav bottom-right ───────────────── */
#proj-nav{position:absolute;bottom:32px;right:28px;display:flex;align-items:center;gap:10px;pointer-events:all}
.arr-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-user-select:none;user-select:none;pointer-events:all}
.arr-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
#proj-count{font-size:11px;color:rgba(255,255,255,0.35);min-width:38px;text-align:center;letter-spacing:.05em}

/* ─── Hint bottom-center ─────────────────────── */
#hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:.16em;text-transform:uppercase;pointer-events:none}

/* ─── Cursor ─────────────────────────────────── */
#csr{position:fixed;z-index:300;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:transform .12s ease}
#csr.big{transform:translate(-50%,-50%) scale(3.5)}

/* ─── Modal ──────────────────────────────────── */
#modal{position:fixed;inset:0;z-index:50;display:flex;opacity:0;pointer-events:none;transition:opacity .35s,backdrop-filter .35s;background:rgba(0,0,0,0);backdrop-filter:blur(0px)}
#modal.open{opacity:1;pointer-events:all;background:rgba(0,0,0,0.72);backdrop-filter:blur(12px)}
#modal-bd{position:absolute;inset:0;z-index:-1}
#m-panel{width:clamp(300px,38vw,480px);height:100%;background:#080810;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:32px;overflow-y:auto;position:relative;transform:translateX(-100%);transition:transform .42s cubic-bezier(.22,1,.36,1)}
#modal.open #m-panel{transform:none}
#m-gal{flex:1;height:100%;overflow-y:auto;background:#040408;transform:translateX(40px);opacity:0;transition:transform .42s cubic-bezier(.22,1,.36,1) .06s,opacity .42s ease .06s;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent}
#modal.open #m-gal{transform:none;opacity:1}
#m-gal img{width:100%;display:block;border-bottom:1px solid rgba(255,255,255,0.04)}
.m-close{position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.07);border:none;cursor:pointer;color:rgba(255,255,255,0.55);font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.m-close:hover{background:rgba(255,255,255,0.14);color:#fff}
#m-num{font-size:10px;color:rgba(255,255,255,0.28);letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
#m-title{font-size:20px;font-weight:500;line-height:1.32;letter-spacing:-.02em;color:#fff;margin-bottom:14px}
#m-hr{height:1px;background:rgba(255,255,255,0.07);margin-bottom:14px}
.m-desc{font-size:13px;line-height:1.75;color:rgba(255,255,255,0.46)}
.m-desc+.m-desc{margin-top:9px}
#m-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.mt{font-size:10px;color:rgba(255,255,255,0.38);background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:9999px;padding:3px 9px}
#m-hint{font-size:10px;color:rgba(255,255,255,0.22);margin-top:10px;display:flex;align-items:center;gap:4px}
#m-link{display:inline-flex;align-items:center;gap:5px;margin-top:auto;padding-top:26px;font-size:11px;font-weight:500;color:rgba(255,255,255,0.7);border-bottom:1px solid rgba(255,255,255,0.25);padding-bottom:2px;text-decoration:none;align-self:flex-start;transition:opacity .15s}
#m-link:hover{opacity:.55}
.gal-spin{display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:rgba(255,255,255,0.2);gap:8px}
</style>

/* ══ CANVAS TEXTURE BUILDER ═══════════════════════════ */
function buildScreenTex(p, size = 1024) {
  const S = size, H = Math.round(S * 0.625); // 16:10
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = H;
  const ctx = cv.getContext('2d');

  // Background
  const bg = ctx.createLinearGradient(0, 0, S, H);
  bg.addColorStop(0, p.color);
  bg.addColorStop(1, '#000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, S, H);

  // Accent glow (top bar)
  ctx.fillStyle = p.accent + '22';
  ctx.fillRect(0, 0, S, 4);
  ctx.fillStyle = p.accent;
  ctx.fillRect(0, 0, S, 2);

  // Grid lines (blueprint feel)
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 60; x < S; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 60; y < H; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(S, y); ctx.stroke();
  }

  // Number tag
  ctx.font = `600 ${S * 0.022}px Inter, sans-serif`;
  ctx.fillStyle = p.accent + 'aa';
  ctx.fillText(p.num, S * 0.05, H * 0.14);

  // Title
  ctx.font = `600 ${S * 0.06}px Inter, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(p.label, S * 0.05, H * 0.42);

  // Subtitle
  ctx.font = `400 ${S * 0.033}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillText(p.sub, S * 0.05, H * 0.56);

  // Tags
  let tx = S * 0.05;
  const ty = H * 0.82;
  ctx.font = `500 ${S * 0.026}px Inter, sans-serif`;
  (p.tags.slice(0, 3)).forEach(tag => {
    const tw = ctx.measureText(tag).width + S * 0.05;
    ctx.strokeStyle = p.accent + '55';
    ctx.lineWidth = 1;
    roundRect(ctx, tx, ty - S * 0.025, tw, S * 0.042, S * 0.008);
    ctx.stroke();
    ctx.fillStyle = p.accent + 'bb';
    ctx.fillText(tag, tx + S * 0.025, ty + S * 0.008);
    tx += tw + S * 0.02;
    if (tx > S * 0.8) return;
  });

  // "View Case Study" prompt
  ctx.font = `500 ${S * 0.026}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fillText('→ Click to view case study', S * 0.05, H * 0.92);

  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ─── MONITOR BUILDER ────────────────────────────────── */
const screenMeshes = [];  // clickable screens

function buildMonitor(sw, sh, px, py, pz, rotY) {
  const grp = new THREE.Group();

  // Outer bezel (frame)
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(sw + 0.18, sh + 0.18, 0.12), bezelMat);
  bezel.castShadow = true;
  grp.add(bezel);

  // Screen face (emissive canvas texture applied here)
  const screenGeo = new THREE.PlaneGeometry(sw, sh);
  const screenMat = new THREE.MeshBasicMaterial({ color: 0x111128 });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.z = 0.065;
  grp.add(screen);
  screenMeshes.push(screen);

  // Screen emissive glow (behind bezel, bleeds light)
  const glow = new THREE.Mesh(
    new THREE.BoxGeometry(sw * 0.9, sh * 0.9, 0.02),
    new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0x224488, emissiveIntensity: 0.6 })
  );
  glow.position.z = -0.04;
  grp.add(glow);

  // Monitor stand
  const stand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.55, 0.1), bezelMat);
  stand.position.y = -(sh / 2 + 0.275);
  grp.add(stand);

  // Stand base
  const base = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 0.45), bezelMat);
  base.position.y = -(sh / 2 + 0.555);
  grp.add(base);

  grp.position.set(px, py, pz);
  grp.rotation.y = rotY;
  scene.add(grp);

  return { grp, screen };
}

  color: 0x222230, roughness: 0.6, metalness: 0.2
}));
mug.position.set(-1.5, 0.17, 1.05);
scene.add(mug);

// Notebook
const nb = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.03, 0.42), new THREE.MeshStandardMaterial({
  color: 0x181820, roughness: 0.9
}));
nb.position.set(-1.0, 0.075, 1.15);
nb.rotation.y = 0.15;
scene.add(nb);

// Pen
const pen = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.36, 8), new THREE.MeshStandardMaterial({
  color: 0x555570, roughness: 0.3, metalness: 0.7
}));
pen.position.set(-0.72, 0.088, 1.22);
pen.rotation.z = Math.PI / 2;
pen.rotation.y = 0.2;
scene.add(pen);

/* ─── FLOATING PARTICLES ─────────────────────────────── */
const PC = 280;
const pBuf = new Float32Array(PC * 3);
const pPhs = new Float32Array(PC);
for (let i = 0; i < PC; i++) {
  pBuf[i*3]   = (Math.random() - 0.5) * 18;
  pBuf[i*3+1] = Math.random() * 8 - 1.5;
  pBuf[i*3+2] = (Math.random() - 0.5) * 12;
  pPhs[i] = Math.random() * Math.PI * 2;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pBuf, 3));
const partSys = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0x4466cc, size: 0.028, transparent: true, opacity: 0.55, depthWrite: false
}));
scene.add(partSys);

/* ─── TEXTURE PRECOMPUTE ─────────────────────────────── */
const TEX = PROJECTS.map(p => buildScreenTex(p));

/* ─── STATE ──────────────────────────────────────────── */
let curIdx = 0;

function adj(base, offset) {
  return ((base + offset) % PROJECTS.length + PROJECTS.length) % PROJECTS.length;
}

function applyScreens() {
  mainMon.screen.material = new THREE.MeshBasicMaterial({ map: TEX[curIdx], toneMapped: false });
  leftMon.screen.material = new THREE.MeshBasicMaterial({ map: TEX[adj(curIdx, -1)], toneMapped: false });
  rightMon.screen.material = new THREE.MeshBasicMaterial({ map: TEX[adj(curIdx,  1)], toneMapped: false });

  const p = PROJECTS[curIdx];
  document.getElementById('hud-num').textContent   = p.num;
  document.getElementById('hud-label').textContent = p.label + ' — ' + p.sub;
  document.getElementById('proj-count').textContent = `${curIdx + 1} / ${PROJECTS.length}`;

  // Update monitor glow color to match project accent
  const c = new THREE.Color(p.accent);
  monGlow.color.set(c);
}

function navigate(dir) {
  curIdx = adj(curIdx, dir);
  applyScreens();
}

document.getElementById('prev').addEventListener('click', () => navigate(-1));
document.getElementById('next').addEventListener('click', () => navigate(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

/* ─── RAYCASTER (click monitors) ────────────────────── */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clickTargets = [mainMon.screen, leftMon.screen, rightMon.screen];

window.addEventListener('mousemove', e => {
  pointer.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

renderer.domElement.addEventListener('click', () => {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets);
  if (!hits.length) return;
  const idx = clickTargets.indexOf(hits[0].object);
  if      (idx === 0) openModal(curIdx);
  else if (idx === 1) navigate(-1);
  else if (idx === 2) navigate(1);
});

// Hover cursor
renderer.domElement.addEventListener('mousemove', () => {
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickTargets).length > 0;
  csr.classList.toggle('big', hit);
  renderer.domElement.style.cursor = 'none';
});

/* ─── RESIZE ─────────────────────────────────────────── */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

/* ─── ANIMATION LOOP ─────────────────────────────────── */
const clock = new THREE.Clock();
let running = false;

// Camera target (smooth)
let camX = 0, camY = 1.8, camTX = 0, camTY = 1.8;

function animate() {
  if (!running) return;
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Camera parallax
  camTX = (mx - 0.5) * 0.7;
  camTY = 1.8 - (my - 0.5) * 0.3 + Math.sin(t * 0.35) * 0.025;
  camX += (camTX - camX) * 0.04;
  camY += (camTY - camY) * 0.04;
  camera.position.x = camX;
  camera.position.y = camY;
  camera.lookAt(0, 0.5, 0);

  // Lights pulse
  monGlow.intensity  = 7.5 + Math.sin(t * 1.4) * 0.6;
  leftGlow.intensity = 3.5 + Math.sin(t * 0.9 + 1.2) * 0.5;
  rightGlow.intensity= 3.5 + Math.sin(t * 0.7 + 0.6) * 0.5;
  lamp.intensity     = 3.0 + Math.sin(t * 0.5) * 0.3;

  // Particles drift upward
  const pp = pGeo.attributes.position;
  for (let i = 0; i < PC; i++) {
    pp.setY(i, pp.getY(i) + 0.004);
    if (pp.getY(i) > 6.5) pp.setY(i, -1.5);
  }
  pp.needsUpdate = true;
  partSys.rotation.y = t * 0.015;

  renderer.render(scene, camera);
}

/* ─── LOADING ────────────────────────────────────────── */
let prog = 0;
const fill = document.getElementById('ld-fill');
const pctEl = document.getElementById('ld-pct');

function step() {
  prog = Math.min(100, prog + Math.random() * 9 + 2);
  fill.style.width = prog + '%';
  pctEl.textContent = Math.floor(prog) + '%';
  if (prog >= 100) {
    applyScreens();
    running = true;
    animate();
    const ld = document.getElementById('loading');
    ld.style.opacity = '0';
    setTimeout(() => ld.style.display = 'none', 650);
  } else {
    setTimeout(step, 28 + Math.random() * 45);
  }
}
setTimeout(step, 200);

/* ─── MODAL ──────────────────────────────────────────── */
function openModal(idx) {
  const p = PROJECTS[idx];
  document.getElementById('m-num').textContent   = p.num;
  document.getElementById('m-title').innerHTML   = p.label + '<br><span style="font-size:14px;font-weight:400;color:rgba(255,255,255,0.45)">' + p.sub + '</span>';
  document.getElementById('m-d1').textContent    = p.d1;
  document.getElementById('m-d2').textContent    = p.d2;
  document.getElementById('m-link').href         = p.link;
  document.getElementById('m-tags').innerHTML    = p.tags.map(t => `<span class="mt">${t}</span>`).join('');

  const gal = document.getElementById('m-gal');
  gal.innerHTML = '';
  gal.scrollTop = 0;
  p.images.forEach((url, i) => {
    const img = document.createElement('img');
    img.src = url;
    img.alt = `${p.label} ${i + 1}`;
    img.loading = i === 0 ? 'eager' : 'lazy';
    gal.appendChild(img);
  });

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('m-close').addEventListener('click', closeModal);
document.getElementById('modal-bd').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
